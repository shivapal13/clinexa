services:

  db:
    image: postgres:17

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Shiva%402005
      POSTGRES_DB: clinexa_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinexa_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7

    container_name: clinexa-redis

    ports:
      - "6379:6379"

    restart: unless-stopped    

  api:
    build: .

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started 

  celery_worker:
    build: .

    command: celery -A app.core.celery_app:celery_app worker --loglevel=info

    env_file:
     - .env

    depends_on:
      - redis
      - db 
  celery_beat:
    build: .

    command: celery -A app.core.celery_app:celery_app beat --loglevel=info

    env_file:
      - .env

    depends_on:
     - redis
     - db            

volumes:
  postgres_data: